name: Deploy AWS File Manager

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aws-file-manager
  ECR_REGISTRY: 877348951990.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_URI: 877348951990.dkr.ecr.us-east-1.amazonaws.com/aws-file-manager:latest
  EC2_INSTANCE_ID: i-0ae3986b3a76c0561

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          python - "$TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::877348951990:role/GitHubActionsAwsFileManagerDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t "$IMAGE_URI" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE_URI"

      - name: Deploy to EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy aws-file-manager" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 877348951990.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 877348951990.dkr.ecr.us-east-1.amazonaws.com/aws-file-manager:latest",
              "docker stop aws-file-manager-container || true",
              "docker rm aws-file-manager-container || true",
              "docker run -d --name aws-file-manager-container --network aws-docker-app_default --restart unless-stopped --env-file /etc/aws-file-manager/.env 877348951990.dkr.ecr.us-east-1.amazonaws.com/aws-file-manager:latest",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Deployment completed successfully."