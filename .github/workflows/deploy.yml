name: Deploy AWS File Manager

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "877348951990"
  ECR_REPOSITORY: aws-file-manager
  ECR_REGISTRY: 877348951990.dkr.ecr.us-east-1.amazonaws.com
  EC2_INSTANCE_ID: i-0ae3986b3a76c0561

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::877348951990:role/GitHubActionsAwsFileManagerDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Create a unique image tag from the Git commit SHA
      - name: Set Docker image variables
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "Image tag: ${IMAGE_TAG}"
          echo "Image URI: ${IMAGE_URI}"

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t "$IMAGE_URI" \
            .

      # 6. Push image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE_URI"

      # 7. Deploy the exact image to EC2 using SSM
      - name: Deploy to EC2 using SSM
        shell: bash
        run: |
          set -e

          echo "Deploying image:"
          echo "$IMAGE_URI"

          COMMANDS=$(jq -nc \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            '[
              "set -e",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("docker pull " + $image),
              "docker stop aws-file-manager-container || true",
              "docker rm aws-file-manager-container || true",
              ("docker run -d --name aws-file-manager-container --network aws-docker-app_default --restart unless-stopped --env-file /etc/aws-file-manager/.env " + $image),
              "docker image prune -f"
            ]'
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy aws-file-manager ${IMAGE_TAG}" \
            --parameters "commands=${COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait until SSM command finishes
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then

            echo "SSM deployment command completed."
          else

            echo "SSM deployment command failed."

            echo "----- STDOUT -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text || true

            echo "----- STDERR -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text || true

            exit 1
          fi

      # 8. Confirm deployment
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "AWS File Manager deployment successful"
          echo "Image: $IMAGE_URI"
          echo "Commit: $GITHUB_SHA"
          echo "======================================"